# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = GeistMono Nerd Font Mono


general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/wallpapers/wallhaven-qr327r_1920x1080.png
    blur_passes = 1
    blur_size = 4
    contrast = 1
    vibrancy_darkness = 0.3
}

input-field {
    monitor =
    size = 14%, 4%
    outline_thickness = 0
    inner_color = rgba(60, 56, 54, 0.9) # no fill

    # outer_color = rgba(204, 36, 29, 0.6)
    check_color = rgba(255, 255, 255, 0.9)
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = 
    fail_text = $PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}

# Battery
label {
    monitor =
    # Get battery percentage and a simple icon
    text = cmd[update:1000] echo -e "$(cat /sys/class/power_supply/BAT0/capacity)% $([ "$(cat /sys/class/power_supply/BAT0/status)" = "Charging" ] && echo "󱐋")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 18
    font_family = $font
    position = -24, 24
    halign = right
    valign = bottom
}
